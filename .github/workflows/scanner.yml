name: Binance RSI Divergence Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "1 * * * *"     # every hour, 1 min after close -> 1H timeframe
    - cron: "5 0 * * *"     # daily at 00:05 UTC, after daily candle closes -> 1D timeframe
    - cron: "10 0 * * 1"    # Monday 00:10 UTC, after weekly candle closes -> 1W timeframe

permissions:
  contents: write

concurrency:
  group: binance-rsi-divergence
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine timeframe for this run
        id: tf
        run: |
          case "${{ github.event.schedule }}" in
            "1 * * * *") echo "TF=1H" >> "$GITHUB_ENV" ;;
            "5 0 * * *") echo "TF=1D" >> "$GITHUB_ENV" ;;
            "10 0 * * 1") echo "TF=1W" >> "$GITHUB_ENV" ;;
            *) echo "TF=1H,1D,1W" >> "$GITHUB_ENV" ;;
          esac

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RSI_PERIOD: "14"
          PIVOT_LEFT: "5"
          LOOKBACK: "220"
          MIN_QUOTE_VOLUME: "1000000"
          MAX_SYMBOLS: "250"
          TIMEFRAMES: ${{ env.TF }}
        run: python scanner.py

      - name: Save alert state
        run: |
          git config user.name "binance-rsi-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update divergence alert state"
          git push
